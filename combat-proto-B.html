<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Combat · Variant B — Hotbar</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0D0D14; --panel:#14141C; --panel2:#1C1C26; --border:#2A2A3A;
    --gold:#D4A537; --goldDim:#8A6A20;
    --text:#F5F5F5; --text2:#A0A0B0;
    --danger:#E63946; --success:#4A9D5F; --warning:#E8A947;
    --ally:#4A9D5F; --enemy:#E63946;
    --radius-sm:8px; --radius-md:12px; --radius-lg:16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:#000;color:var(--text);font-family:Inter,sans-serif;height:100%}
  body{display:flex;justify-content:center;align-items:center;min-height:100vh;padding:24px;background:radial-gradient(circle at 50% 30%,#1a1a2a 0%,#060609 70%)}
  .phone{width:390px;height:844px;background:var(--bg);border-radius:52px;overflow:hidden;border:8px solid #111;box-shadow:0 40px 80px rgba(0,0,0,.7);position:relative;display:flex;flex-direction:column}
  .notch{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:130px;height:32px;background:#000;border-radius:20px;z-index:10}
  .status{padding:14px 28px 4px;display:flex;justify-content:space-between;font-size:13px;font-weight:600}
  .status .r{display:flex;gap:4px}
  .screen{flex:1;display:flex;flex-direction:column;padding:8px 14px 12px;gap:10px;overflow:hidden}

  /* Fighter cards side-by-side */
  .fighters{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .fighter{background:var(--panel);border-radius:var(--radius-lg);padding:10px;border:1px solid var(--border);position:relative}
  .fighter.ally{border-color:rgba(74,157,95,.45)}
  .fighter.enemy{border-color:rgba(230,57,70,.45)}
  .fighter .label{font-family:Oswald,sans-serif;font-size:10px;letter-spacing:3px;text-align:center;padding-bottom:4px;color:var(--ally)}
  .fighter.enemy .label{color:var(--enemy)}
  .portrait{aspect-ratio:1/1;border-radius:var(--radius-md);overflow:hidden;background:#222;border:2px solid var(--ally);position:relative}
  .fighter.enemy .portrait{border-color:var(--enemy)}
  .portrait img{width:100%;height:100%;object-fit:cover}
  /* Intent ghost arrows on enemy portrait */
  .intent-ghost{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.65);border:1px solid var(--warning);padding:3px 8px;border-radius:10px;font-size:9px;font-weight:700;color:var(--warning);letter-spacing:1px}
  /* stance highlight overlay on portrait */
  .stance-ov{position:absolute;inset:0;pointer-events:none}
  .stance-ov .hit{position:absolute;width:28px;height:28px;border-radius:50%;left:50%;transform:translateX(-50%);background:radial-gradient(circle,rgba(212,165,55,.7),transparent 70%);box-shadow:0 0 14px rgba(212,165,55,.8)}
  .stance-ov .hit.head{top:6%} .stance-ov .hit.chest{top:42%} .stance-ov .hit.legs{top:70%}
  .stance-ov .def{position:absolute;width:36px;height:36px;left:50%;transform:translateX(-50%);border:2px solid #6A9BD8;border-radius:50%;background:rgba(106,155,216,.1)}
  .stance-ov .def.head{top:4%} .stance-ov .def.chest{top:40%} .stance-ov .def.legs{top:68%}
  .fighter .name{font-family:Oswald,sans-serif;font-size:15px;text-transform:uppercase;letter-spacing:.5px;text-align:center;margin-top:6px}
  .fighter .meta{font-size:10px;color:var(--text2);text-align:center;margin-top:1px}
  .hpbar{margin-top:8px;height:8px;background:#0a0a10;border:1px solid #1a1a24;border-radius:6px;overflow:hidden}
  .hpbar > span{display:block;height:100%;background:linear-gradient(90deg,#4A9D5F,#2E6B3A);transition:width .6s}
  .fighter.enemy .hpbar > span{background:linear-gradient(90deg,#E63946,#9A1A25)}
  .hpnum{text-align:center;font-family:Oswald,sans-serif;font-size:11px;color:var(--text);margin-top:3px;letter-spacing:.5px}

  /* Stance picker */
  .picker{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-lg);padding:12px;display:flex;flex-direction:column;gap:10px}
  .row{display:flex;align-items:center;gap:8px}
  .row .tag{width:58px;font-family:Oswald,sans-serif;font-size:11px;letter-spacing:2px;text-transform:uppercase}
  .row.attack .tag{color:var(--danger)}
  .row.defend .tag{color:#6A9BD8}
  .row .btns{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .btn{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:10px 4px;font-family:Oswald,sans-serif;font-size:12px;letter-spacing:1px;color:var(--text);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;transition:all .15s}
  .btn .ico{font-size:16px;opacity:.7}
  .row.attack .btn.active{border-color:var(--danger);background:rgba(230,57,70,.15);color:var(--danger)}
  .row.attack .btn.active .ico{opacity:1;color:var(--danger)}
  .row.defend .btn.active{border-color:#6A9BD8;background:rgba(106,155,216,.15);color:#6A9BD8}
  .row.defend .btn.active .ico{opacity:1;color:#6A9BD8}

  /* Bottom: hotbar + STRIKE with radial timer */
  .bottom{margin-top:auto;display:flex;gap:8px;align-items:center;position:relative}
  .hotbar{display:flex;gap:6px}
  .slot{width:48px;height:48px;background:var(--panel2);border:1px solid var(--border);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;position:relative;cursor:pointer;overflow:hidden}
  .slot.ready{border-color:var(--gold);box-shadow:0 0 10px rgba(212,165,55,.3)}
  .slot .cd{position:absolute;inset:0;background:conic-gradient(rgba(0,0,0,.75) var(--p,0%),transparent 0)}
  .slot.cooling{opacity:.55}
  .slot .n{position:absolute;bottom:-14px;left:50%;transform:translateX(-50%);font-size:8px;color:var(--text2);letter-spacing:.5px;white-space:nowrap}

  .strike-wrap{margin-left:auto;position:relative;width:110px;height:70px}
  .strike{width:110px;height:70px;border-radius:20px;background:linear-gradient(180deg,#D4A537,#A67A1E);border:2px solid var(--gold);color:#1a1a20;font-family:Oswald,sans-serif;font-size:18px;font-weight:700;letter-spacing:3px;cursor:pointer;position:relative;z-index:2}
  .arc{position:absolute;inset:-6px;border-radius:26px;background:conic-gradient(var(--gold) var(--p,70%), rgba(255,255,255,.05) 0);-webkit-mask:radial-gradient(circle,transparent 53%,black 54%);mask:radial-gradient(circle,transparent 53%,black 54%);z-index:1;transition:background .15s}
  .arc.danger{background:conic-gradient(var(--danger) var(--p,70%),rgba(255,255,255,.05) 0)}
  .timer-num{position:absolute;top:-24px;right:4px;font-family:Oswald,sans-serif;font-size:13px;color:var(--gold);font-weight:700;letter-spacing:1px}
  .timer-num.danger{color:var(--danger)}
  .skip-btn{position:absolute;right:0;bottom:-22px;font-size:10px;color:var(--text2);background:transparent;border:none;letter-spacing:2px;text-transform:uppercase;cursor:pointer}

  .meta-row{display:flex;justify-content:space-between;padding:2px 4px;font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:2px}
  .meta-row .round{color:var(--gold);font-family:Oswald,sans-serif;font-size:12px;letter-spacing:3px}
</style>
</head>
<body>
<div class="phone">
  <div class="notch"></div>
  <div class="status"><span>9:24</span><span class="r">···· 📶 🔋</span></div>
  <div class="screen">
    <div class="meta-row"><span>Round <span class="round">3</span></span><span>Best of 5</span></div>

    <div class="fighters">
      <div class="fighter ally">
        <div class="label">· YOU ·</div>
        <div class="portrait">
          <img src="https://api.dicebear.com/7.x/adventurer/svg?seed=Degon&backgroundColor=1a2a1a"/>
          <div class="stance-ov"><div class="hit chest" id="youHit"></div><div class="def chest" id="youDef"></div></div>
        </div>
        <div class="name">Degon</div>
        <div class="meta">Lv.18 Warrior</div>
        <div class="hpbar"><span style="width:82%"></span></div>
        <div class="hpnum">1313 / 1600</div>
      </div>
      <div class="fighter enemy">
        <div class="label">· ENEMY ·</div>
        <div class="portrait">
          <img src="https://api.dicebear.com/7.x/adventurer/svg?seed=Nightclaw&backgroundColor=2a1a1a"/>
          <div class="intent-ghost">Intent: Chest ↑</div>
        </div>
        <div class="name">Nightclaw</div>
        <div class="meta">Lv.18 Mage</div>
        <div class="hpbar"><span style="width:54%"></span></div>
        <div class="hpnum">864 / 1600</div>
      </div>
    </div>

    <div class="picker">
      <div class="row attack">
        <div class="tag">Attack</div>
        <div class="btns">
          <button class="btn" data-z="attack" data-v="head"><span class="ico">🧠</span>HEAD</button>
          <button class="btn active" data-z="attack" data-v="chest"><span class="ico">❤</span>CHEST</button>
          <button class="btn" data-z="attack" data-v="legs"><span class="ico">🦵</span>LEGS</button>
        </div>
      </div>
      <div class="row defend">
        <div class="tag">Defend</div>
        <div class="btns">
          <button class="btn" data-z="defend" data-v="head"><span class="ico">🛡</span>HEAD</button>
          <button class="btn active" data-z="defend" data-v="chest"><span class="ico">🛡</span>CHEST</button>
          <button class="btn" data-z="defend" data-v="legs"><span class="ico">🛡</span>LEGS</button>
        </div>
      </div>
    </div>

    <div class="bottom">
      <div class="hotbar">
        <div class="slot ready"><span>💥</span><span class="n">Burst</span></div>
        <div class="slot cooling" style="--p:65%"><span>🛡</span><div class="cd"></div><span class="n">3s</span></div>
        <div class="slot"><span>🧪</span><span class="n">Potion</span></div>
      </div>
      <div class="strike-wrap">
        <div class="arc" id="arc" style="--p:70%"></div>
        <div class="timer-num" id="tNum">2.8s</div>
        <button class="strike" id="strike">STRIKE</button>
        <button class="skip-btn">Skip turn</button>
      </div>
    </div>
  </div>
</div>
<script>
  document.querySelectorAll('.btn').forEach(el=>{
    el.addEventListener('click',()=>{
      const z=el.dataset.z;
      document.querySelectorAll('.btn[data-z="'+z+'"]').forEach(x=>x.classList.remove('active'));
      el.classList.add('active');
      // sync portrait overlays
      const v=el.dataset.v;
      if(z==='attack'){ const h=document.getElementById('youHit'); h.className='hit '+v; }
      if(z==='defend'){ const h=document.getElementById('youDef'); h.className='def '+v; }
    });
  });
  const arc=document.getElementById('arc');
  const tNum=document.getElementById('tNum');
  const strike=document.getElementById('strike');
  let t=4.0;
  setInterval(()=>{
    t-=0.05; if(t<=0) t=4.0;
    const pct=(t/4.0)*100;
    arc.style.setProperty('--p', pct+'%');
    tNum.textContent=t.toFixed(1)+'s';
    if(t<1.5){arc.classList.add('danger');tNum.classList.add('danger')} else {arc.classList.remove('danger');tNum.classList.remove('danger')}
  },50);
  strike.addEventListener('click',()=>{ t=4.0; strike.style.transform='scale(.95)'; setTimeout(()=>strike.style.transform='',120); });
</script>
</body>
</html>
