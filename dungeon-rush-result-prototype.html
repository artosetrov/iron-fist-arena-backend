<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dungeon Rush — Result Screen v3</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap');

  :root {
    --bg-abyss: #08080C;
    --bg-primary: #0D0D12;
    --bg-secondary: #1A1A2E;
    --bg-tertiary: #16213E;
    --gold: #D4A537;
    --gold-bright: #FFD700;
    --gold-dim: #8B6914;
    --danger: #E63946;
    --purple: #9B59B6;
    --cyan: #00D4FF;
    --text-primary: #F5F5F5;
    --text-secondary: #A0A0B0;
    --text-tertiary: #6B6B80;
    --border-subtle: #2A2A3E;
    --border-medium: #3A3A50;
    --border-strong: #4A4A60;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #111;
    font-family: 'Inter', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }

  .phone-frame {
    width: 393px;
    height: 852px;
    border-radius: 48px;
    border: 3px solid #333;
    overflow: hidden;
    position: relative;
    background: var(--bg-primary);
  }

  .screen {
    width: 100%;
    height: 100%;
    position: relative;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ===== ATMOSPHERIC BG ===== */
  .bg-layer {
    position: absolute;
    inset: 0;
    z-index: 0;
    background:
      radial-gradient(ellipse 80% 50% at 50% 25%, rgba(212,165,55,0.18) 0%, transparent 70%),
      var(--bg-primary);
  }
  .screen.defeated .bg-layer {
    background:
      radial-gradient(ellipse 80% 50% at 50% 25%, rgba(230,57,70,0.18) 0%, transparent 70%),
      var(--bg-primary);
  }

  /* Particles */
  .particles {
    position: absolute; inset: 0; z-index: 1; pointer-events: none; overflow: hidden;
  }
  .particle {
    position: absolute; width: 3px; height: 3px;
    background: var(--gold-bright); border-radius: 50%; opacity: 0;
    animation: float-up 4s ease-in-out infinite;
  }
  .particle:nth-child(1) { left: 15%; animation-delay: 0s; }
  .particle:nth-child(2) { left: 30%; animation-delay: 0.7s; animation-duration: 3.5s; }
  .particle:nth-child(3) { left: 50%; animation-delay: 1.4s; animation-duration: 4.2s; }
  .particle:nth-child(4) { left: 68%; animation-delay: 0.3s; animation-duration: 3.8s; }
  .particle:nth-child(5) { left: 82%; animation-delay: 2s; animation-duration: 3.3s; }
  .particle:nth-child(6) { left: 40%; animation-delay: 1.8s; }
  .screen.defeated .particle { background: var(--danger); }
  @keyframes float-up {
    0% { transform: translateY(500px) scale(0.5); opacity: 0; }
    15% { opacity: 0.6; }
    85% { opacity: 0.2; }
    100% { transform: translateY(-60px) scale(1); opacity: 0; }
  }

  .content {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    height: 100%;
  }

  /* ===== HEADER ===== */
  .header {
    display: flex;
    align-items: center;
    padding: 60px 20px 0;
    height: 92px;
    flex-shrink: 0;
  }
  .back-btn {
    width: 36px; height: 36px; border-radius: 50%;
    background: rgba(255,255,255,0.06); border: 1px solid var(--border-subtle);
    display: flex; align-items: center; justify-content: center;
    color: var(--text-secondary); font-size: 18px;
  }

  /* ===== HERO ILLUSTRATION — BIG ===== */
  .illustration-spacer {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .illustration {
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .illustration-glow {
    position: absolute;
    width: 320px; height: 320px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(212,165,55,0.2) 0%, rgba(212,165,55,0.06) 45%, transparent 70%);
    animation: glow-breathe 3s ease-in-out infinite;
  }
  .screen.defeated .illustration-glow {
    background: radial-gradient(circle, rgba(230,57,70,0.18) 0%, rgba(230,57,70,0.05) 45%, transparent 70%);
  }
  @keyframes glow-breathe {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.06); opacity: 0.75; }
  }
  .illustration-img {
    position: relative;
    font-size: 140px;
    line-height: 1;
    filter: drop-shadow(0 0 30px rgba(212,165,55,0.35));
  }
  .screen.defeated .illustration-img {
    filter: drop-shadow(0 0 30px rgba(230,57,70,0.4));
  }

  /* ===== TITLE ===== */
  .title-block {
    text-align: center;
    padding: 8px 24px 0;
    flex-shrink: 0;
  }
  .result-title {
    font-family: 'Oswald', sans-serif;
    font-size: 44px;
    font-weight: 600;
    color: var(--gold-bright);
    letter-spacing: 4px;
    text-shadow: 0 0 24px rgba(255,215,0,0.5), 0 0 60px rgba(212,165,55,0.2);
    animation: title-glow 2.5s ease-in-out infinite;
  }
  .screen.defeated .result-title {
    color: var(--danger);
    text-shadow: 0 0 24px rgba(230,57,70,0.5), 0 0 60px rgba(230,57,70,0.2);
  }
  @keyframes title-glow {
    0%, 100% { text-shadow: 0 0 16px rgba(255,215,0,0.3); }
    50% { text-shadow: 0 0 30px rgba(255,215,0,0.6), 0 0 60px rgba(212,165,55,0.25); }
  }
  .result-subtitle {
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    color: var(--text-secondary);
    margin-top: 4px;
  }

  /* ===== ROOM PROGRESS ICONS ===== */
  .room-progress {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    margin-top: 10px;
    flex-wrap: wrap;
    max-width: 320px;
  }
  .room-node {
    width: 22px;
    height: 22px;
    border-radius: 5px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    position: relative;
    transition: all 0.3s;
  }
  .room-node.cleared {
    background: rgba(212,165,55,0.2);
    border: 1.5px solid var(--gold);
    color: var(--gold-bright);
    box-shadow: 0 0 6px rgba(212,165,55,0.25);
  }
  .room-node.died {
    background: rgba(230,57,70,0.2);
    border: 1.5px solid var(--danger);
    color: var(--danger);
    box-shadow: 0 0 6px rgba(230,57,70,0.2);
  }
  .room-node.locked {
    background: var(--border-subtle);
    border: 1.5px solid var(--border-medium);
    color: var(--text-tertiary);
    opacity: 0.4;
  }
  .room-node.boss {
    width: 26px;
    height: 26px;
    font-size: 13px;
    border-width: 2px;
  }
  .room-connector {
    width: 8px;
    height: 2px;
    border-radius: 1px;
  }
  .room-connector.active {
    background: var(--gold-dim);
  }
  .room-connector.inactive {
    background: var(--border-subtle);
    opacity: 0.3;
  }

  /* ===== REWARDS — BIG COUNTERS ===== */
  .rewards-area {
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    padding: 0 24px 8px;
  }

  .rewards-grid {
    display: flex;
    justify-content: center;
    gap: 0;
    flex-wrap: wrap;
  }

  .reward-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    padding: 16px 0;
  }
  .reward-item + .reward-item {
    border-left: 1px solid rgba(42,42,62,0.6);
  }

  .reward-icon {
    font-size: 44px;
    line-height: 1;
    margin-bottom: 4px;
  }

  .reward-value {
    font-family: 'Oswald', sans-serif;
    font-size: 36px;
    font-weight: 600;
    line-height: 1;
  }
  .reward-value.gold { color: var(--gold-bright); text-shadow: 0 0 16px rgba(255,215,0,0.3); }
  .reward-value.xp { color: #C084FC; text-shadow: 0 0 16px rgba(155,89,182,0.3); }
  .reward-value.items { color: var(--cyan); text-shadow: 0 0 16px rgba(0,212,255,0.3); }

  .reward-label {
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    color: var(--text-tertiary);
    margin-top: 2px;
  }

  /* ===== XP BAR SECTION ===== */
  .xp-section {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 6px;
    margin-top: 12px;
    padding: 0 4px;
  }
  .xp-header {
    display: flex;
    justify-content: space-between;
    width: 100%;
    padding: 0 2px;
  }
  .xp-level {
    font-family: 'Oswald', sans-serif;
    font-size: 16px;
    color: #C084FC;
    text-shadow: 0 0 8px rgba(155,89,182,0.3);
  }
  .xp-numbers {
    font-family: 'Oswald', sans-serif;
    font-size: 14px;
    color: var(--text-secondary);
  }
  .xp-numbers span {
    color: #C084FC;
    font-weight: 600;
  }
  .xp-bar-track {
    width: 100%;
    height: 12px;
    background: var(--bg-tertiary);
    border-radius: 6px;
    overflow: hidden;
    border: 1px solid rgba(155,89,182,0.15);
    box-shadow: inset 0 1px 3px rgba(0,0,0,0.4);
    position: relative;
  }
  .xp-bar-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #8E44AD, #9B59B6, #C084FC);
    border-radius: 6px;
    position: relative;
    transition: width 1.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    box-shadow: 0 0 10px rgba(155,89,182,0.4);
  }
  .xp-bar-fill::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 50%;
    background: linear-gradient(to bottom, rgba(255,255,255,0.25), transparent);
    border-radius: 6px 6px 0 0;
  }
  .xp-gain-badge {
    font-family: 'Oswald', sans-serif;
    font-size: 14px;
    color: rgba(192,132,252,0.9);
    padding: 2px 12px;
    background: rgba(155,89,182,0.12);
    border: 1px solid rgba(155,89,182,0.2);
    border-radius: 20px;
    align-self: center;
  }

  /* Defeat message instead of rewards */
  .defeat-area {
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    padding: 16px 24px;
  }
  .defeat-main {
    font-family: 'Oswald', sans-serif;
    font-size: 20px;
    color: var(--danger);
    letter-spacing: 2px;
  }
  .defeat-sub {
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    color: var(--text-tertiary);
    text-align: center;
  }

  /* ===== DUNGEON PROGRESS (subtle, bottom area) ===== */
  .progress-strip {
    padding: 0 24px;
    flex-shrink: 0;
  }
  .progress-header {
    display: flex;
    justify-content: space-between;
    margin-bottom: 6px;
  }
  .progress-header span {
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    color: var(--text-tertiary);
  }
  .progress-header .pct { color: var(--gold); font-weight: 600; }
  .screen.defeated .progress-header .pct { color: var(--danger); }
  .progress-track {
    width: 100%; height: 6px;
    background: var(--border-subtle);
    border-radius: 3px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--gold-dim), var(--gold), var(--gold-bright));
    border-radius: 3px;
    transition: width 0.5s ease;
  }
  .screen.defeated .progress-fill {
    background: linear-gradient(90deg, #8B1A22, var(--danger), #FF6B6B);
  }

  /* ===== BUTTONS ===== */
  .buttons-area {
    padding: 20px 20px 44px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    flex-shrink: 0;
  }

  .btn-gold {
    width: 100%; height: 56px;
    border: none; border-radius: 12px;
    font-family: 'Oswald', sans-serif; font-size: 20px;
    letter-spacing: 3px; cursor: pointer;
    color: #1A1A2E; font-weight: 600;
    background: linear-gradient(180deg, #FFD700 0%, #D4A537 40%, #B8860B 100%);
    position: relative; overflow: visible;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.3),
      inset 0 -2px 0 rgba(0,0,0,0.2),
      0 4px 16px rgba(212,165,55,0.35);
  }
  /* Button ornamentals */
  .btn-gold .bb { position: absolute; pointer-events: none; }
  .btn-gold .bb::before, .btn-gold .bb::after { content: ''; position: absolute; background: var(--gold-bright); }
  .btn-gold .bb.tl { top: -1px; left: -1px; }
  .btn-gold .bb.tl::before { width: 16px; height: 2px; }
  .btn-gold .bb.tl::after { width: 2px; height: 16px; }
  .btn-gold .bb.tr { top: -1px; right: -1px; }
  .btn-gold .bb.tr::before { width: 16px; height: 2px; right: 0; }
  .btn-gold .bb.tr::after { width: 2px; height: 16px; right: 0; }
  .btn-gold .bb.bl { bottom: -1px; left: -1px; }
  .btn-gold .bb.bl::before { width: 16px; height: 2px; bottom: 0; }
  .btn-gold .bb.bl::after { width: 2px; height: 16px; bottom: 0; }
  .btn-gold .bb.br { bottom: -1px; right: -1px; }
  .btn-gold .bb.br::before { width: 16px; height: 2px; right: 0; bottom: 0; }
  .btn-gold .bb.br::after { width: 2px; height: 16px; right: 0; bottom: 0; }
  .btn-gold .bd {
    position: absolute; width: 6px; height: 6px;
    background: var(--gold-bright); transform: rotate(45deg); pointer-events: none;
  }
  .btn-gold .bd.tl { top: -4px; left: -4px; }
  .btn-gold .bd.tr { top: -4px; right: -4px; }
  .btn-gold .bd.bl { bottom: -4px; left: -4px; }
  .btn-gold .bd.br { bottom: -4px; right: -4px; }

  .btn-ghost {
    width: 100%; height: 44px;
    border: 1.5px solid var(--border-medium);
    border-radius: 10px;
    font-family: 'Oswald', sans-serif; font-size: 16px;
    letter-spacing: 2px; cursor: pointer;
    background: rgba(26,26,46,0.4);
    color: var(--text-secondary);
  }

  /* ===== TAB SWITCHER ===== */
  .variant-tabs {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 8px; z-index: 100;
    background: rgba(13,13,18,0.95); padding: 6px;
    border-radius: 12px; border: 1px solid var(--border-subtle);
  }
  .variant-tab {
    padding: 8px 16px; border-radius: 8px; border: none;
    font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 600;
    cursor: pointer; color: var(--text-tertiary); background: transparent;
  }
  .variant-tab.active { background: #1E2240; color: var(--gold-bright); }
</style>
</head>
<body>

<div class="phone-frame">
  <div class="screen escaped" id="screen">
    <div class="bg-layer"></div>
    <div class="particles">
      <div class="particle"></div><div class="particle"></div><div class="particle"></div>
      <div class="particle"></div><div class="particle"></div><div class="particle"></div>
    </div>

    <div class="content">
      <!-- HEADER (minimal — just back button) -->
      <div class="header">
        <div class="back-btn">←</div>
      </div>

      <!-- TITLE -->
      <div class="title-block">
        <div class="result-title" id="title">ESCAPED!</div>
        <div class="room-progress" id="room-progress"></div>
      </div>

      <!-- ILLUSTRATION centered between title and rewards -->
      <div class="illustration-spacer">
        <div class="illustration">
          <div class="illustration-glow"></div>
          <div class="illustration-img" id="art">🛡️</div>
        </div>
      </div>

      <!-- REWARDS — BIG, closer to buttons -->
      <div class="rewards-area" id="rewards-area">
        <!-- Gold + Items row -->
        <div class="rewards-grid">
          <div class="reward-item">
            <div class="reward-icon">💰</div>
            <div class="reward-value gold" id="gold-val-display">+0</div>
            <div class="reward-label">Gold</div>
          </div>
          <div class="reward-item" id="items-col">
            <div class="reward-icon">⚔️</div>
            <div class="reward-value items">2</div>
            <div class="reward-label">Items</div>
          </div>
        </div>
        <!-- XP bar full width -->
        <div class="xp-section">
          <div class="xp-header">
            <span class="xp-level">Level 14</span>
            <span class="xp-numbers"><span id="xp-current">0</span> / 280</span>
          </div>
          <div class="xp-bar-track">
            <div class="xp-bar-fill" id="xp-bar-fill"></div>
          </div>
          <div class="xp-gain-badge">+<span id="xp-gain-num">0</span> XP</div>
        </div>
      </div>

      <!-- DEFEAT MESSAGE (hidden) -->
      <div class="defeat-area" id="defeat-area" style="display: none;">
        <div class="defeat-main">ALL REWARDS LOST!</div>
        <div class="defeat-sub">Escape next time to keep your loot</div>
      </div>

      <!-- PROGRESS (hidden — replaced by room icons) -->
      <div class="progress-strip" style="display: none;">
        <div class="progress-header">
          <span id="room-label">Room 3 of 12</span>
          <span class="pct" id="room-pct">25%</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" id="progress-fill" style="width: 25%;"></div>
        </div>
      </div>

      <!-- BUTTONS -->
      <div class="buttons-area">
        <button class="btn-gold" id="btn-primary">
          <span class="bb tl"></span><span class="bb tr"></span>
          <span class="bb bl"></span><span class="bb br"></span>
          <span class="bd tl"></span><span class="bd tr"></span>
          <span class="bd bl"></span><span class="bd br"></span>
          VIEW LOOT
        </button>
        <button class="btn-ghost" id="btn-secondary">EXIT</button>
      </div>
    </div>
  </div>
</div>

<div class="variant-tabs">
  <button class="variant-tab active" onclick="showVariant('escaped', this)">Escaped</button>
  <button class="variant-tab" onclick="showVariant('complete', this)">Complete</button>
  <button class="variant-tab" onclick="showVariant('defeated', this)">Defeated</button>
</div>

<script>
function renderRooms(cleared, diedAt, total) {
  const container = document.getElementById('room-progress');
  container.innerHTML = '';
  for (let i = 1; i <= total; i++) {
    // Room node
    const node = document.createElement('div');
    node.className = 'room-node';
    const isBoss = (i === total);
    if (isBoss) node.classList.add('boss');

    if (i <= cleared) {
      node.classList.add('cleared');
      node.textContent = '✓';
    } else if (i === diedAt) {
      node.classList.add('died');
      node.textContent = '✕';
    } else {
      node.classList.add('locked');
      node.textContent = isBoss ? '💀' : i;
    }
    container.appendChild(node);

    // Connector between rooms (not after last)
    if (i < total) {
      const conn = document.createElement('div');
      conn.className = 'room-connector ' + (i < cleared || (i === cleared && diedAt === 0) ? 'active' : 'inactive');
      container.appendChild(conn);
    }
  }
}

function showVariant(v, tab) {
  const s = document.getElementById('screen');
  document.querySelectorAll('.variant-tab').forEach(t => t.classList.remove('active'));
  tab.classList.add('active');
  s.className = 'screen ' + v;

  const title = document.getElementById('title');
  const art = document.getElementById('art');
  const rewards = document.getElementById('rewards-area');
  const defeat = document.getElementById('defeat-area');
  const progressStrip = document.querySelector('.progress-strip');
  const btnP = document.getElementById('btn-primary');

  if (v === 'escaped') {
    art.textContent = '🛡️';
    title.textContent = 'ESCAPED!';
    rewards.style.display = 'flex'; defeat.style.display = 'none';
    progressStrip.style.display = 'none';
    renderRooms(3, 0, 12);
    btnP.childNodes[btnP.childNodes.length - 1].textContent = 'VIEW LOOT';
    animateRewards();
  } else if (v === 'complete') {
    art.textContent = '👑';
    title.textContent = 'COMPLETE!';
    rewards.style.display = 'flex'; defeat.style.display = 'none';
    progressStrip.style.display = 'none';
    renderRooms(12, 0, 12);
    btnP.childNodes[btnP.childNodes.length - 1].textContent = 'VIEW LOOT';
    animateRewards();
  } else {
    art.textContent = '💀';
    title.textContent = 'DEFEATED';
    rewards.style.display = 'none'; defeat.style.display = 'flex';
    progressStrip.style.display = 'none';
    renderRooms(0, 1, 12);
    btnP.childNodes[btnP.childNodes.length - 1].textContent = 'TRY AGAIN';
  }
}

// Animated counters
function animateValue(el, start, end, duration, prefix) {
  prefix = prefix || '';
  const range = end - start;
  const startTime = performance.now();
  function step(now) {
    const elapsed = now - startTime;
    const progress = Math.min(elapsed / duration, 1);
    // ease out cubic
    const eased = 1 - Math.pow(1 - progress, 3);
    const current = Math.round(start + range * eased);
    el.textContent = prefix + current;
    if (progress < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

function animateRewards() {
  const goldEl = document.getElementById('gold-val-display');
  const xpCurrentEl = document.getElementById('xp-current');
  const xpGainEl = document.getElementById('xp-gain-num');
  const xpBar = document.getElementById('xp-bar-fill');

  // Reset
  goldEl.textContent = '+0';
  xpCurrentEl.textContent = '0';
  xpGainEl.textContent = '0';
  xpBar.style.width = '35%'; // starting xp (100/280)
  xpBar.style.transition = 'none';

  setTimeout(() => {
    // Gold count-up
    animateValue(goldEl, 0, 62, 1200, '+');

    // XP bar animate
    xpBar.style.transition = 'width 1.5s cubic-bezier(0.25, 0.46, 0.45, 0.94)';
    xpBar.style.width = '48%'; // (100+35)/280 ≈ 48%

    // XP current number count-up
    animateValue(xpCurrentEl, 100, 135, 1500, '');

    // XP gain badge count-up
    animateValue(xpGainEl, 0, 35, 1000, '');
  }, 400);
}

// Init
renderRooms(3, 0, 12);
animateRewards();
</script>
