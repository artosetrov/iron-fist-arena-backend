<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Combat · Variant A — Vertical</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0D0D14; --panel:#14141C; --panel2:#1C1C26; --border:#2A2A3A;
    --gold:#D4A537; --goldDim:#8A6A20;
    --text:#F5F5F5; --text2:#A0A0B0; --textDim:#555566;
    --danger:#E63946; --success:#4A9D5F; --warning:#E8A947;
    --ally:#4A9D5F; --enemy:#E63946;
    --radius-sm:8px; --radius-md:12px; --radius-lg:16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:#000;color:var(--text);font-family:Inter,sans-serif;height:100%}
  body{display:flex;justify-content:center;align-items:center;min-height:100vh;padding:24px;background:radial-gradient(circle at 50% 30%,#1a1a2a 0%,#060609 70%)}
  .phone{width:390px;height:844px;background:var(--bg);border-radius:52px;overflow:hidden;border:8px solid #111;box-shadow:0 40px 80px rgba(0,0,0,.7);position:relative;display:flex;flex-direction:column}
  .notch{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:130px;height:32px;background:#000;border-radius:20px;z-index:10}
  .status{padding:14px 28px 4px;display:flex;justify-content:space-between;font-size:13px;font-weight:600}
  .status .r{display:flex;gap:4px;align-items:center}
  .screen{flex:1;display:flex;flex-direction:column;padding:8px 14px 10px;gap:10px;overflow:hidden}
  h3,h4{margin:0;font-family:Oswald,sans-serif}

  /* Enemy strip (TOP) */
  .enemy-strip{background:linear-gradient(180deg,rgba(230,57,70,.12),rgba(230,57,70,.04));border:1px solid rgba(230,57,70,.3);border-radius:var(--radius-lg);padding:10px 12px;display:flex;align-items:center;gap:12px;position:relative}
  .portrait{width:56px;height:56px;border-radius:14px;overflow:hidden;border:2px solid var(--enemy);flex-shrink:0;background:#222}
  .portrait.ally{border-color:var(--ally)}
  .portrait img{width:100%;height:100%;object-fit:cover}
  .info{flex:1;min-width:0}
  .info .name{font-family:Oswald,sans-serif;font-size:18px;font-weight:600;letter-spacing:.5px;text-transform:uppercase}
  .info .meta{font-size:11px;color:var(--text2);margin-top:1px}
  .hpbar{margin-top:6px;height:8px;background:#0a0a10;border-radius:6px;overflow:hidden;position:relative;border:1px solid #1a1a24}
  .hpbar > span{display:block;height:100%;background:linear-gradient(90deg,#E63946,#9A1A25);transition:width .6s}
  .hpbar.ally > span{background:linear-gradient(90deg,#4A9D5F,#2E6B3A)}
  .hpnum{font-family:Oswald,sans-serif;font-size:11px;color:var(--text2);letter-spacing:.5px;margin-top:3px}
  .intent{position:absolute;top:8px;right:10px;font-size:10px;color:var(--warning);background:rgba(232,169,71,.15);border:1px solid rgba(232,169,71,.4);padding:2px 8px;border-radius:10px;letter-spacing:1px;text-transform:uppercase;font-weight:600}

  /* Decision center */
  .decision{flex:1;display:flex;flex-direction:column;justify-content:center;gap:12px;padding:6px 0}
  .label{font-family:Oswald,sans-serif;font-size:11px;color:var(--text2);letter-spacing:3px;text-transform:uppercase;text-align:center}
  .label.attack{color:var(--danger)}
  .label.defend{color:#6A9BD8}

  .zones{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .zone{aspect-ratio:1/.9;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-md);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;transition:all .15s;padding:8px}
  .zone .ico{font-size:22px;opacity:.7}
  .zone .t{font-family:Oswald,sans-serif;font-size:13px;letter-spacing:1px}
  .zone:active{opacity:.85}
  .zone.attack.active{border-color:var(--danger);background:linear-gradient(180deg,rgba(230,57,70,.2),rgba(230,57,70,.05));box-shadow:inset 0 0 0 1px var(--danger)}
  .zone.attack.active .ico, .zone.attack.active .t{color:var(--danger);opacity:1}
  .zone.defend.active{border-color:#6A9BD8;background:linear-gradient(180deg,rgba(106,155,216,.2),rgba(106,155,216,.05));box-shadow:inset 0 0 0 1px #6A9BD8}
  .zone.defend.active .ico, .zone.defend.active .t{color:#6A9BD8;opacity:1}

  /* Your strip */
  .you-strip{background:linear-gradient(180deg,rgba(74,157,95,.1),rgba(74,157,95,.03));border:1px solid rgba(74,157,95,.3);border-radius:var(--radius-lg);padding:10px 12px;display:flex;align-items:center;gap:12px;position:relative}
  .you-strip .streak{position:absolute;top:8px;right:10px;font-size:10px;color:var(--gold);letter-spacing:1px;font-weight:600}
  .you-strip .streak b{font-family:Oswald,sans-serif;font-size:14px}

  /* Action bar */
  .actionbar{display:flex;gap:8px;align-items:stretch;margin-top:2px}
  .active-slot{width:54px;height:54px;border-radius:var(--radius-md);background:var(--panel2);border:1px solid var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;cursor:pointer;overflow:hidden}
  .active-slot .emoji{font-size:22px}
  .active-slot .cd{position:absolute;inset:0;background:conic-gradient(rgba(0,0,0,.75) var(--p,0%), transparent 0);mix-blend-mode:multiply;pointer-events:none}
  .active-slot .name{position:absolute;bottom:2px;font-size:8px;color:var(--gold);letter-spacing:.5px;font-weight:600}
  .active-slot.ready{border-color:var(--gold);box-shadow:0 0 12px rgba(212,165,55,.3)}
  .active-slot.ready .cd{--p:0%}
  .active-slot.cooling{opacity:.6}
  .active-slot.cooling .cd{--p:65%}

  .strike{flex:1;position:relative;overflow:hidden;border-radius:var(--radius-md);background:#23241b;border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;cursor:pointer;height:54px}
  .strike .fill{position:absolute;inset:0;background:linear-gradient(90deg,#D4A537 0%,#B88829 100%);width:var(--t,70%);transition:width .2s linear;z-index:0}
  .strike .lbl{position:relative;z-index:1;font-family:Oswald,sans-serif;font-size:18px;font-weight:700;color:#1a1a20;letter-spacing:3px;text-shadow:0 1px 0 rgba(255,255,255,.1)}
  .strike .timer{position:absolute;top:4px;right:10px;z-index:2;font-family:Oswald,sans-serif;font-size:11px;color:#1a1a20;opacity:.8;font-weight:700}
  .strike.danger{border-color:var(--danger)}
  .strike.danger .fill{background:linear-gradient(90deg,#E63946,#8A1A25)}
  .strike.danger .lbl{color:#fff}
  .strike.danger .timer{color:#fff}

  .skip{position:absolute;top:-26px;right:0;font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:2px;background:transparent;border:none;cursor:pointer;padding:4px 8px}
  .skip:hover{color:var(--text)}

  .bar-wrap{position:relative}

  /* Commentary card */
  .meta-row{display:flex;justify-content:space-between;align-items:center;padding:2px 4px;font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:2px}
  .meta-row .round{color:var(--gold);font-family:Oswald,sans-serif;font-size:12px;letter-spacing:3px}
</style>
</head>
<body>
<div class="phone">
  <div class="notch"></div>
  <div class="status"><span>9:24</span><span class="r">···· 📶 🔋</span></div>
  <div class="screen">

    <div class="meta-row"><span>Round <span class="round">3</span></span><span>Best of 5</span></div>

    <!-- ENEMY (top) -->
    <div class="enemy-strip">
      <div class="portrait"><img src="https://api.dicebear.com/7.x/adventurer/svg?seed=Nightclaw&backgroundColor=2a1a1a" alt=""/></div>
      <div class="info">
        <div class="name">Nightclaw <span style="font-size:11px;color:var(--text2);font-weight:400">Lv.18 Mage</span></div>
        <div class="hpbar"><span style="width:54%"></span></div>
        <div class="hpnum">864 / 1600</div>
      </div>
      <div class="intent">⚡ Likely Chest</div>
    </div>

    <!-- DECISION -->
    <div class="decision">
      <div class="label attack">· Choose Attack ·</div>
      <div class="zones">
        <div class="zone attack" data-z="attack" data-v="head"><div class="ico">🧠</div><div class="t">HEAD</div></div>
        <div class="zone attack active" data-z="attack" data-v="chest"><div class="ico">❤</div><div class="t">CHEST</div></div>
        <div class="zone attack" data-z="attack" data-v="legs"><div class="ico">🦵</div><div class="t">LEGS</div></div>
      </div>

      <div class="label defend">· Choose Defend ·</div>
      <div class="zones">
        <div class="zone defend" data-z="defend" data-v="head"><div class="ico">🛡</div><div class="t">HEAD</div></div>
        <div class="zone defend active" data-z="defend" data-v="chest"><div class="ico">🛡</div><div class="t">CHEST</div></div>
        <div class="zone defend" data-z="defend" data-v="legs"><div class="ico">🛡</div><div class="t">LEGS</div></div>
      </div>
    </div>

    <!-- YOU (bottom) -->
    <div class="you-strip">
      <div class="portrait ally"><img src="https://api.dicebear.com/7.x/adventurer/svg?seed=Degon&backgroundColor=1a2a1a" alt=""/></div>
      <div class="info">
        <div class="name">Degon <span style="font-size:11px;color:var(--text2);font-weight:400">Lv.18 Warrior</span></div>
        <div class="hpbar ally"><span style="width:82%"></span></div>
        <div class="hpnum">1313 / 1600</div>
      </div>
      <div class="streak">STREAK <b>×3</b></div>
    </div>

    <!-- ACTION BAR -->
    <div class="bar-wrap">
      <button class="skip">Skip</button>
      <div class="actionbar">
        <div class="active-slot ready"><div class="emoji">💥</div><div class="name">BURST</div></div>
        <div class="active-slot cooling"><div class="emoji">🛡</div><div class="cd"></div><div class="name">3s</div></div>
        <button class="strike" id="strike">
          <div class="fill"></div>
          <span class="timer" id="timer">2.8s</span>
          <span class="lbl">STRIKE</span>
        </button>
      </div>
    </div>

  </div>
</div>
<script>
  // stance selection
  document.querySelectorAll('.zone').forEach(el=>{
    el.addEventListener('click',()=>{
      const z=el.dataset.z;
      document.querySelectorAll('.zone[data-z="'+z+'"]').forEach(x=>x.classList.remove('active'));
      el.classList.add('active');
    });
  });
  // timer fills the button as it elapses
  const strike=document.getElementById('strike');
  const fill=strike.querySelector('.fill');
  const tlbl=document.getElementById('timer');
  let t=4.0;
  const tick=()=>{
    t-=0.05; if(t<=0) t=4.0;
    const pct=(t/4.0)*100;
    fill.style.width=pct+'%';
    tlbl.textContent=t.toFixed(1)+'s';
    if(t<1.5){strike.classList.add('danger')} else {strike.classList.remove('danger')}
  };
  setInterval(tick,50);
  strike.addEventListener('click',()=>{ t=4.0; strike.style.transform='scale(.98)'; setTimeout(()=>strike.style.transform='',120); });
  // skip
  document.querySelector('.skip').addEventListener('click',()=>alert('Skip (ghost secondary)'));
</script>
</body>
</html>
