<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Combat · Variant C — Stance Silhouette</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0D0D14; --panel:#14141C; --panel2:#1C1C26; --border:#2A2A3A;
    --gold:#D4A537; --text:#F5F5F5; --text2:#A0A0B0;
    --danger:#E63946; --success:#4A9D5F; --warning:#E8A947;
    --ally:#4A9D5F; --enemy:#E63946;
    --atk:#E63946; --def:#6A9BD8;
    --radius-md:12px; --radius-lg:16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:#000;color:var(--text);font-family:Inter,sans-serif;height:100%}
  body{display:flex;justify-content:center;align-items:center;min-height:100vh;padding:24px;background:radial-gradient(circle at 50% 30%,#1a1a2a 0%,#060609 70%)}
  .phone{width:390px;height:844px;background:var(--bg);border-radius:52px;overflow:hidden;border:8px solid #111;box-shadow:0 40px 80px rgba(0,0,0,.7);position:relative;display:flex;flex-direction:column}
  .notch{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:130px;height:32px;background:#000;border-radius:20px;z-index:10}
  .status{padding:14px 28px 4px;display:flex;justify-content:space-between;font-size:13px;font-weight:600}
  .screen{flex:1;display:flex;flex-direction:column;padding:8px 14px 12px;gap:10px;overflow:hidden;position:relative}

  /* Top: enemy compact strip */
  .enemy-top{background:linear-gradient(180deg,rgba(230,57,70,.12),rgba(230,57,70,0));border:1px solid rgba(230,57,70,.35);border-radius:var(--radius-lg);padding:8px 10px;display:flex;align-items:center;gap:10px}
  .mini-portrait{width:44px;height:44px;border-radius:10px;overflow:hidden;border:2px solid var(--enemy)}
  .mini-portrait img{width:100%;height:100%;object-fit:cover}
  .enemy-top .info{flex:1;min-width:0}
  .enemy-top .name{font-family:Oswald,sans-serif;font-size:14px;letter-spacing:1px;text-transform:uppercase}
  .enemy-top .meta{font-size:10px;color:var(--text2)}
  .hpbar{margin-top:4px;height:6px;background:#0a0a10;border:1px solid #1a1a24;border-radius:4px;overflow:hidden}
  .hpbar > span{display:block;height:100%;background:linear-gradient(90deg,#E63946,#9A1A25)}
  .hpbar.ally > span{background:linear-gradient(90deg,#4A9D5F,#2E6B3A)}
  .enemy-top .hpnum{font-family:Oswald,sans-serif;font-size:10px;color:var(--text2);margin-top:2px}
  .enemy-top .intent{font-size:9px;color:var(--warning);border:1px solid rgba(232,169,71,.4);background:rgba(232,169,71,.1);padding:2px 6px;border-radius:8px;letter-spacing:1px;font-weight:700;white-space:nowrap}

  /* Mode toggle */
  .modes{display:flex;gap:6px;padding:4px;background:var(--panel);border:1px solid var(--border);border-radius:12px}
  .mode{flex:1;text-align:center;padding:8px;font-family:Oswald,sans-serif;font-size:12px;letter-spacing:2px;cursor:pointer;border-radius:8px;color:var(--text2)}
  .mode.active.atk{background:rgba(230,57,70,.15);color:var(--atk);border:1px solid rgba(230,57,70,.5)}
  .mode.active.def{background:rgba(106,155,216,.15);color:var(--def);border:1px solid rgba(106,155,216,.5)}
  .mode .pick{display:block;font-size:10px;opacity:.7;margin-top:2px;letter-spacing:1px}

  /* Silhouette */
  .stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center}
  .silhouette{position:relative;width:180px;height:340px;margin:0 auto}
  .sil-layer{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center}
  .zone{position:absolute;left:50%;transform:translateX(-50%);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-family:Oswald,sans-serif;font-size:11px;letter-spacing:1px;color:var(--text2);transition:all .15s;background:rgba(20,20,28,.6);border:2px dashed rgba(255,255,255,.15)}
  .zone .lbl{position:absolute;left:calc(100% + 8px);white-space:nowrap;font-size:10px;color:var(--text2);letter-spacing:2px}
  .zone.head{top:0;width:72px;height:72px}
  .zone.chest{top:100px;width:104px;height:104px}
  .zone.legs{top:226px;width:96px;height:96px}
  /* selections */
  .zone.atk-pick{border:2px solid var(--atk);background:radial-gradient(circle,rgba(230,57,70,.4),rgba(230,57,70,.05));box-shadow:0 0 24px rgba(230,57,70,.5);color:#fff}
  .zone.def-pick{border:2px solid var(--def);background:radial-gradient(circle,rgba(106,155,216,.35),rgba(106,155,216,.05));box-shadow:0 0 24px rgba(106,155,216,.5);color:#fff}
  .zone.atk-pick.def-pick{background:radial-gradient(circle,rgba(230,57,70,.35),rgba(106,155,216,.3));border-color:#b77;box-shadow:0 0 26px rgba(200,100,120,.6)}
  /* enemy intent ghost arrow */
  .intent-arrow{position:absolute;top:100px;left:-28px;width:24px;height:24px;border-radius:50%;background:rgba(232,169,71,.2);border:1.5px solid var(--warning);display:flex;align-items:center;justify-content:center;color:var(--warning);font-weight:700;font-size:12px;animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}

  /* You strip pinned above action bar */
  .you-strip{display:flex;align-items:center;gap:8px;padding:6px 10px;background:linear-gradient(180deg,rgba(74,157,95,0),rgba(74,157,95,.1));border:1px solid rgba(74,157,95,.35);border-radius:var(--radius-lg)}
  .you-strip .info{flex:1}
  .you-strip .name{font-family:Oswald,sans-serif;font-size:13px;letter-spacing:1px;text-transform:uppercase}
  .you-strip .mini-portrait{border-color:var(--ally)}
  .streak{font-size:10px;color:var(--gold);font-weight:700;letter-spacing:1px;white-space:nowrap}
  .streak b{font-family:Oswald,sans-serif;font-size:13px}

  /* Bottom action bar */
  .bar{display:flex;gap:8px;align-items:center;position:relative}
  .actives{display:flex;flex-direction:column;gap:6px}
  .slot{width:44px;height:44px;background:var(--panel2);border:1px solid var(--border);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;position:relative;cursor:pointer}
  .slot.ready{border-color:var(--gold);box-shadow:0 0 10px rgba(212,165,55,.35)}
  .slot.cooling{opacity:.6}
  .slot .cd{position:absolute;inset:0;background:conic-gradient(rgba(0,0,0,.75) var(--p,0%),transparent 0);border-radius:10px}

  .strike{flex:1;height:76px;position:relative;overflow:hidden;border-radius:18px;border:2px solid var(--gold);background:#222019;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .strike .fill{position:absolute;inset:0;background:linear-gradient(90deg,#D4A537,#A67A1E);width:var(--t,70%);transition:width .15s linear}
  .strike .lbl{position:relative;z-index:1;font-family:Oswald,sans-serif;font-size:22px;font-weight:700;color:#1a1a20;letter-spacing:4px;text-shadow:0 1px 0 rgba(255,255,255,.1)}
  .strike .timer{position:absolute;top:6px;right:10px;z-index:2;font-family:Oswald,sans-serif;font-size:12px;color:#1a1a20;font-weight:700}
  .strike.danger{border-color:var(--danger)}
  .strike.danger .fill{background:linear-gradient(90deg,#E63946,#8A1A25)}
  .strike.danger .lbl,.strike.danger .timer{color:#fff}
  .skip{position:absolute;top:-24px;right:0;font-size:11px;color:var(--text2);background:transparent;border:none;letter-spacing:2px;text-transform:uppercase;cursor:pointer}

  .meta-row{display:flex;justify-content:space-between;padding:2px 4px;font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:2px}
  .meta-row .round{color:var(--gold);font-family:Oswald,sans-serif;font-size:12px;letter-spacing:3px}
</style>
</head>
<body>
<div class="phone">
  <div class="notch"></div>
  <div class="status"><span>9:24</span><span>···· 📶 🔋</span></div>
  <div class="screen">
    <div class="meta-row"><span>Round <span class="round">3</span></span><span>Best of 5</span></div>

    <div class="enemy-top">
      <div class="mini-portrait"><img src="https://api.dicebear.com/7.x/adventurer/svg?seed=Nightclaw&backgroundColor=2a1a1a" alt=""/></div>
      <div class="info">
        <div class="name">Nightclaw <span style="color:var(--text2);font-weight:400;font-size:10px">Lv.18 Mage</span></div>
        <div class="hpbar"><span style="width:54%"></span></div>
        <div class="hpnum">864 / 1600</div>
      </div>
      <div class="intent">Intent: Chest ↑</div>
    </div>

    <div class="modes">
      <div class="mode atk active" id="modeAtk">Attack <span class="pick" id="pickAtk">· chest ·</span></div>
      <div class="mode def" id="modeDef">Defend <span class="pick" id="pickDef">· chest ·</span></div>
    </div>

    <div class="stage">
      <div class="silhouette">
        <div class="intent-arrow">↑</div>
        <div class="zone head atk-pick" data-part="head" title="Head"><span>HEAD</span></div>
        <div class="zone chest atk-pick def-pick" data-part="chest" title="Chest"><span>CHEST</span></div>
        <div class="zone legs" data-part="legs" title="Legs"><span>LEGS</span></div>
      </div>
    </div>

    <div class="you-strip">
      <div class="mini-portrait"><img src="https://api.dicebear.com/7.x/adventurer/svg?seed=Degon&backgroundColor=1a2a1a" alt=""/></div>
      <div class="info">
        <div class="name">Degon <span style="color:var(--text2);font-weight:400;font-size:10px">Lv.18 Warrior</span></div>
        <div class="hpbar ally"><span style="width:82%"></span></div>
      </div>
      <div class="streak">STREAK <b>×3</b></div>
    </div>

    <div class="bar">
      <div class="actives">
        <div class="slot ready">💥</div>
        <div class="slot cooling" style="--p:65%">🛡<div class="cd"></div></div>
      </div>
      <button class="strike" id="strike">
        <div class="fill"></div>
        <span class="timer" id="timer">2.8s</span>
        <span class="lbl">STRIKE</span>
      </button>
      <button class="skip">Skip</button>
    </div>
  </div>
</div>
<script>
  let mode='attack'; // or 'defend'
  let picks={attack:'head',defend:'chest'}; // pre-seeded for demo
  function render(){
    document.querySelectorAll('.zone').forEach(z=>{
      z.classList.remove('atk-pick','def-pick');
      if(picks.attack===z.dataset.part) z.classList.add('atk-pick');
      if(picks.defend===z.dataset.part) z.classList.add('def-pick');
    });
    document.getElementById('pickAtk').textContent='· '+picks.attack+' ·';
    document.getElementById('pickDef').textContent='· '+picks.defend+' ·';
    document.getElementById('modeAtk').classList.toggle('active', mode==='attack');
    document.getElementById('modeDef').classList.toggle('active', mode==='defend');
  }
  render();
  document.querySelectorAll('.zone').forEach(z=>{
    z.addEventListener('click',()=>{
      picks[mode]=z.dataset.part;
      // auto-flip to the other mode after pick
      mode = mode==='attack' ? 'defend' : 'attack';
      render();
    });
  });
  document.getElementById('modeAtk').addEventListener('click',()=>{mode='attack';render()});
  document.getElementById('modeDef').addEventListener('click',()=>{mode='defend';render()});
  // timer
  const strike=document.getElementById('strike');
  const fill=strike.querySelector('.fill');
  const tlbl=document.getElementById('timer');
  let t=4.0;
  setInterval(()=>{
    t-=0.05; if(t<=0) t=4.0;
    fill.style.width=(t/4.0*100)+'%';
    tlbl.textContent=t.toFixed(1)+'s';
    if(t<1.5){strike.classList.add('danger')} else {strike.classList.remove('danger')}
  },50);
  strike.addEventListener('click',()=>{ t=4.0; strike.style.transform='scale(.98)'; setTimeout(()=>strike.style.transform='',120); });
</script>
</body>
</html>
