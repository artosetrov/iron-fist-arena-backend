<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Combat · Variant B2 — Revised</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0D0D14; --panel:#14141C; --panel2:#1C1C26; --border:#2A2A3A;
    --gold:#D4A537; --goldDim:#8A6A20;
    --text:#F5F5F5; --text2:#A0A0B0;
    --danger:#E63946; --success:#4A9D5F; --warning:#E8A947;
    --ally:#4A9D5F; --enemy:#E63946;
    --radius-sm:8px; --radius-md:12px; --radius-lg:16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:#000;color:var(--text);font-family:Inter,sans-serif;height:100%}
  body{display:flex;justify-content:center;align-items:center;min-height:100vh;padding:24px;background:radial-gradient(circle at 50% 30%,#1a1a2a 0%,#060609 70%)}
  .phone{width:390px;height:844px;background:var(--bg);border-radius:52px;overflow:hidden;border:8px solid #111;box-shadow:0 40px 80px rgba(0,0,0,.7);position:relative;display:flex;flex-direction:column}
  .notch{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:130px;height:32px;background:#000;border-radius:20px;z-index:10}
  .status{padding:14px 28px 4px;display:flex;justify-content:space-between;font-size:13px;font-weight:600}
  .screen{flex:1;display:flex;flex-direction:column;padding:8px 14px 12px;gap:8px;overflow:hidden}

  .meta-row{display:flex;justify-content:space-between;padding:2px 4px;font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:2px}
  .meta-row .round{color:var(--gold);font-family:Oswald,sans-serif;font-size:12px;letter-spacing:3px}

  /* Fighter cards side-by-side */
  .fighters{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .fighter{background:var(--panel);border-radius:var(--radius-lg);padding:10px;border:1px solid var(--border);position:relative}
  .fighter.ally{border-color:rgba(74,157,95,.45)}
  .fighter.enemy{border-color:rgba(230,57,70,.45)}
  .fighter .label{font-family:Oswald,sans-serif;font-size:10px;letter-spacing:3px;text-align:center;padding-bottom:4px;color:var(--ally)}
  .fighter.enemy .label{color:var(--enemy)}
  .portrait{aspect-ratio:1/1;border-radius:var(--radius-md);overflow:hidden;background:#222;border:2px solid var(--ally);position:relative}
  .fighter.enemy .portrait{border-color:var(--enemy)}
  .portrait img{width:100%;height:100%;object-fit:cover}
  .intent-ghost{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.7);border:1px solid var(--warning);padding:3px 8px;border-radius:10px;font-size:9px;font-weight:700;color:var(--warning);letter-spacing:1px}
  .stance-ov{position:absolute;inset:0;pointer-events:none}
  .stance-ov .hit{position:absolute;width:26px;height:26px;border-radius:50%;left:50%;transform:translateX(-50%);background:radial-gradient(circle,rgba(212,165,55,.7),transparent 70%);box-shadow:0 0 14px rgba(212,165,55,.8)}
  .stance-ov .hit.head{top:6%} .stance-ov .hit.chest{top:42%} .stance-ov .hit.legs{top:70%}
  .stance-ov .def{position:absolute;width:34px;height:34px;left:50%;transform:translateX(-50%);border:2px solid #6A9BD8;border-radius:50%;background:rgba(106,155,216,.1)}
  .stance-ov .def.head{top:4%} .stance-ov .def.chest{top:40%} .stance-ov .def.legs{top:68%}
  .fighter .name{font-family:Oswald,sans-serif;font-size:14px;text-transform:uppercase;letter-spacing:.5px;text-align:center;margin-top:6px}
  .fighter .meta{font-size:10px;color:var(--text2);text-align:center;margin-top:1px}
  .hpbar{margin-top:6px;height:8px;background:#0a0a10;border:1px solid #1a1a24;border-radius:6px;overflow:hidden}
  .hpbar > span{display:block;height:100%;background:linear-gradient(90deg,#4A9D5F,#2E6B3A);transition:width .6s}
  .fighter.enemy .hpbar > span{background:linear-gradient(90deg,#E63946,#9A1A25)}
  .hpnum{text-align:center;font-family:Oswald,sans-serif;font-size:11px;color:var(--text);margin-top:3px;letter-spacing:.5px}

  /* Enemy actives mini-strip — at the bottom of the enemy fighter card */
  .enemy-actives{display:flex;justify-content:center;gap:4px;margin-top:6px}
  .mini-slot{width:22px;height:22px;background:var(--panel2);border:1px solid var(--border);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;position:relative;opacity:.75}
  .mini-slot.used{opacity:.35}
  .mini-slot.firing{opacity:1;border-color:var(--danger);background:rgba(230,57,70,.25);box-shadow:0 0 8px rgba(230,57,70,.6);animation:fire .8s ease-out}
  @keyframes fire{0%{transform:scale(1)}30%{transform:scale(1.25)}100%{transform:scale(1)}}

  /* Fire banner */
  .fire-banner{position:absolute;top:38%;left:50%;transform:translate(-50%,-50%);background:linear-gradient(90deg,rgba(230,57,70,.9),rgba(138,26,37,.9));color:#fff;font-family:Oswald,sans-serif;font-size:13px;letter-spacing:3px;text-transform:uppercase;padding:6px 18px;border-radius:4px;border:1px solid var(--danger);box-shadow:0 0 20px rgba(230,57,70,.5);opacity:0;transition:opacity .3s;z-index:30}
  .fire-banner.show{opacity:1;animation:slam .6s ease-out}
  @keyframes slam{0%{transform:translate(-50%,-50%) scale(2);opacity:0}30%{transform:translate(-50%,-50%) scale(.95);opacity:1}100%{transform:translate(-50%,-50%) scale(1);opacity:1}}

  /* Stance picker */
  .picker{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-lg);padding:10px;display:flex;flex-direction:column;gap:8px}
  .row{display:flex;align-items:center;gap:8px}
  .row .tag{width:54px;font-family:Oswald,sans-serif;font-size:11px;letter-spacing:2px;text-transform:uppercase}
  .row.attack .tag{color:var(--danger)}
  .row.defend .tag{color:#6A9BD8}
  .row .btns{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .btn{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:8px 4px;font-family:Oswald,sans-serif;font-size:12px;letter-spacing:1px;color:var(--text);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;transition:all .15s}
  .btn .ico{font-size:15px;opacity:.7}
  .row.attack .btn.active{border-color:var(--danger);background:rgba(230,57,70,.15);color:var(--danger)}
  .row.attack .btn.active .ico{opacity:1;color:var(--danger)}
  .row.defend .btn.active{border-color:#6A9BD8;background:rgba(106,155,216,.15);color:#6A9BD8}
  .row.defend .btn.active .ico{opacity:1;color:#6A9BD8}

  /* Your actives — directly below the stance picker */
  .your-actives{display:flex;align-items:center;gap:10px;padding:6px 10px;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-lg)}
  .your-actives .lbl{font-family:Oswald,sans-serif;font-size:10px;letter-spacing:2px;color:var(--text2);text-transform:uppercase;width:58px}
  .slots{display:flex;gap:8px;flex:1;justify-content:space-around}
  .slot{width:52px;height:52px;background:var(--panel2);border:1px solid var(--border);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;position:relative;cursor:pointer;overflow:hidden}
  .slot.ready{border-color:var(--gold);box-shadow:0 0 10px rgba(212,165,55,.3)}
  .slot.ready:active{transform:scale(.95)}
  .slot .cd{position:absolute;inset:0;background:conic-gradient(rgba(0,0,0,.75) var(--p,0%),transparent 0)}
  .slot.cooling{opacity:.55}
  .slot .n{position:absolute;bottom:-2px;left:0;right:0;text-align:center;font-size:8px;color:var(--text2);letter-spacing:.5px;pointer-events:none;background:linear-gradient(180deg,transparent,rgba(0,0,0,.7));padding-top:6px}
  .slot.ready .n{color:var(--gold);font-weight:700}
  .slot .cdnum{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-family:Oswald,sans-serif;font-size:15px;font-weight:700;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.8);z-index:2}

  /* Streak bar */
  .streak-row{display:flex;justify-content:space-between;align-items:center;padding:0 6px;font-size:10px;color:var(--text2);letter-spacing:2px;text-transform:uppercase}
  .streak-row .s{color:var(--gold);font-weight:700}
  .streak-row .s b{font-family:Oswald,sans-serif;font-size:14px}

  /* Bottom: SKIP left, STRIKE right — balanced weight */
  .cta-row{display:grid;grid-template-columns:1fr 1.6fr;gap:10px;margin-top:auto}
  .skip-btn{height:64px;border-radius:16px;background:transparent;border:2px solid var(--border);color:var(--text2);font-family:Oswald,sans-serif;font-size:16px;font-weight:600;letter-spacing:3px;cursor:pointer;text-transform:uppercase;transition:all .15s}
  .skip-btn:hover{border-color:var(--text2);color:var(--text)}
  .strike-wrap{position:relative;height:64px}
  .strike{width:100%;height:64px;border-radius:16px;background:linear-gradient(180deg,#D4A537,#A67A1E);border:2px solid var(--gold);color:#1a1a20;font-family:Oswald,sans-serif;font-size:20px;font-weight:700;letter-spacing:4px;cursor:pointer;position:relative;z-index:2}
  .strike:active{transform:scale(.97)}
  .arc{position:absolute;inset:-5px;border-radius:20px;background:conic-gradient(var(--gold) var(--p,70%), rgba(255,255,255,.06) 0);-webkit-mask:radial-gradient(circle,transparent 60%,black 61%);mask:radial-gradient(circle,transparent 60%,black 61%);z-index:1;transition:background .2s}
  .arc.danger{background:conic-gradient(var(--danger) var(--p,70%), rgba(255,255,255,.06) 0)}
  .timer-num{position:absolute;top:-22px;right:6px;font-family:Oswald,sans-serif;font-size:13px;color:var(--gold);font-weight:700;letter-spacing:1px;z-index:3}
  .timer-num.danger{color:var(--danger)}
</style>
</head>
<body>
<div class="phone">
  <div class="notch"></div>
  <div class="status"><span>9:24</span><span>···· 📶 🔋</span></div>
  <div class="screen">
    <div class="meta-row"><span>Round <span class="round">3</span></span><span>Best of 5</span></div>

    <div class="fighters">
      <div class="fighter ally">
        <div class="label">· YOU ·</div>
        <div class="portrait">
          <img src="https://api.dicebear.com/7.x/adventurer/svg?seed=Degon&backgroundColor=1a2a1a" alt=""/>
          <div class="stance-ov"><div class="hit chest" id="youHit"></div><div class="def chest" id="youDef"></div></div>
        </div>
        <div class="name">Degon</div>
        <div class="meta">Lv.18 Warrior</div>
        <div class="hpbar"><span style="width:82%"></span></div>
        <div class="hpnum">1313 / 1600</div>
      </div>
      <div class="fighter enemy">
        <div class="label">· ENEMY ·</div>
        <div class="portrait">
          <img src="https://api.dicebear.com/7.x/adventurer/svg?seed=Nightclaw&backgroundColor=2a1a1a" alt=""/>
          <div class="intent-ghost">Intent: Chest ↑</div>
          <div class="fire-banner" id="fireBanner">🔥 BURST DAMAGE</div>
        </div>
        <div class="name">Nightclaw</div>
        <div class="meta">Lv.18 Mage</div>
        <div class="hpbar"><span style="width:54%"></span></div>
        <div class="hpnum">864 / 1600</div>
        <!-- enemy revealed actives -->
        <div class="enemy-actives" title="Opponent's equipped talents">
          <div class="mini-slot" id="eSlot0">💥</div>
          <div class="mini-slot used" id="eSlot1">🌀</div>
          <div class="mini-slot" id="eSlot2">⚡</div>
        </div>
      </div>
    </div>

    <div class="picker">
      <div class="row attack">
        <div class="tag">Attack</div>
        <div class="btns">
          <button class="btn" data-z="attack" data-v="head"><span class="ico">🧠</span>HEAD</button>
          <button class="btn active" data-z="attack" data-v="chest"><span class="ico">❤</span>CHEST</button>
          <button class="btn" data-z="attack" data-v="legs"><span class="ico">🦵</span>LEGS</button>
        </div>
      </div>
      <div class="row defend">
        <div class="tag">Defend</div>
        <div class="btns">
          <button class="btn" data-z="defend" data-v="head"><span class="ico">🛡</span>HEAD</button>
          <button class="btn active" data-z="defend" data-v="chest"><span class="ico">🛡</span>CHEST</button>
          <button class="btn" data-z="defend" data-v="legs"><span class="ico">🛡</span>LEGS</button>
        </div>
      </div>
    </div>

    <!-- Your actives directly under the stance picker -->
    <div class="your-actives">
      <div class="lbl">Talents</div>
      <div class="slots">
        <div class="slot ready" id="s0">💥<div class="n">Burst</div></div>
        <div class="slot cooling" id="s1" style="--p:65%">🛡<div class="cd"></div><div class="cdnum">3</div><div class="n">Shield</div></div>
        <div class="slot ready" id="s2">🧪<div class="n">Potion</div></div>
      </div>
    </div>

    <div class="streak-row">
      <span>Streak <span class="s"><b>×3</b></span></span>
      <span>Gear Score 1240</span>
    </div>

    <!-- SKIP left · STRIKE right -->
    <div class="cta-row">
      <button class="skip-btn">Skip</button>
      <div class="strike-wrap">
        <div class="arc" id="arc" style="--p:70%"></div>
        <div class="timer-num" id="tNum">2.8s</div>
        <button class="strike" id="strike">STRIKE</button>
      </div>
    </div>
  </div>
</div>
<script>
  document.querySelectorAll('.btn').forEach(el=>{
    el.addEventListener('click',()=>{
      const z=el.dataset.z;
      document.querySelectorAll('.btn[data-z="'+z+'"]').forEach(x=>x.classList.remove('active'));
      el.classList.add('active');
      const v=el.dataset.v;
      if(z==='attack'){ document.getElementById('youHit').className='hit '+v; }
      if(z==='defend'){ document.getElementById('youDef').className='def '+v; }
    });
  });
  const arc=document.getElementById('arc');
  const tNum=document.getElementById('tNum');
  const strike=document.getElementById('strike');
  let t=4.0;
  setInterval(()=>{
    t-=0.05; if(t<=0) t=4.0;
    arc.style.setProperty('--p', (t/4.0*100)+'%');
    tNum.textContent=t.toFixed(1)+'s';
    if(t<1.5){arc.classList.add('danger');tNum.classList.add('danger')} else {arc.classList.remove('danger');tNum.classList.remove('danger')}
  },50);
  strike.addEventListener('click',()=>{ t=4.0 });

  // Demo: enemy fires BURST every ~6s
  const eSlots=[document.getElementById('eSlot0'),document.getElementById('eSlot1'),document.getElementById('eSlot2')];
  const names=['BURST DAMAGE','WHIRLWIND','THUNDERSTRIKE'];
  let fireIdx=0;
  function enemyFire(){
    const idx=fireIdx%3;
    // find first not-used
    let pickIdx=-1;
    for(let i=0;i<3;i++){ if(!eSlots[i].classList.contains('used')){ pickIdx=i; break; } }
    if(pickIdx<0){ eSlots.forEach(s=>s.classList.remove('used')); pickIdx=0; }
    const el=eSlots[pickIdx];
    el.classList.add('firing');
    const banner=document.getElementById('fireBanner');
    banner.textContent='🔥 '+names[pickIdx];
    banner.classList.add('show');
    setTimeout(()=>{
      el.classList.remove('firing');
      el.classList.add('used');
      banner.classList.remove('show');
    },1400);
    fireIdx++;
  }
  setTimeout(enemyFire,2500);
  setInterval(enemyFire,6500);

  // Your active click — consumable feel
  ['s0','s2'].forEach(id=>{
    document.getElementById(id).addEventListener('click',function(){
      if(!this.classList.contains('ready')) return;
      this.classList.remove('ready');
      this.classList.add('cooling');
      this.style.setProperty('--p','100%');
      const cdn=document.createElement('div');cdn.className='cdnum';cdn.textContent='5';this.appendChild(cdn);
      if(!this.querySelector('.cd')){ const c=document.createElement('div');c.className='cd';this.appendChild(c); }
      let c=5; const iv=setInterval(()=>{
        c--; cdn.textContent=c;
        this.style.setProperty('--p',(c/5*100)+'%');
        if(c<=0){clearInterval(iv); this.classList.remove('cooling'); this.classList.add('ready'); cdn.remove(); const cd=this.querySelector('.cd'); if(cd) cd.remove();}
      },1000);
    });
  });
</script>
</body>
</html>
