name: CI - Secret Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tracked-secret-scan:
    name: Tracked Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check tracked files for secrets
        run: python3 scripts/check_tracked_secrets.py
