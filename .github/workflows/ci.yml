name: CI - Build Check

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'admin/**'
      - 'Hexbound/Config/**'
      - 'Hexbound/fastlane/**'
      - 'Hexbound/scripts/**'
      - 'Hexbound/Hexbound/App/AppConstants.swift'
      - 'Hexbound/Hexbound/Info.plist'
      - 'Hexbound/Hexbound.xcodeproj/project.pbxproj'
      - 'scripts/**'
      - 'docs/10_operations/RELEASE_IOS.md'
      - '.github/workflows/ci.yml'
      - 'docs/06_game_systems/**'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'admin/**'
      - 'Hexbound/Config/**'
      - 'Hexbound/fastlane/**'
      - 'Hexbound/scripts/**'
      - 'Hexbound/Hexbound/App/AppConstants.swift'
      - 'Hexbound/Hexbound/Info.plist'
      - 'Hexbound/Hexbound.xcodeproj/project.pbxproj'
      - 'scripts/**'
      - 'docs/10_operations/RELEASE_IOS.md'
      - '.github/workflows/ci.yml'
      - 'docs/06_game_systems/**'

jobs:
  backend-build:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npx prisma generate
      - run: npx vitest run
      - run: npm run docs:balance:check
      - run: npx next build

  admin-build:
    name: Admin Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - run: npm ci
      - run: npx prisma generate
      - run: npx next build

  prisma-schema-sync:
    name: Prisma Schema & Migration Drift Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check backend/admin schemas match
        run: diff backend/prisma/schema.prisma admin/prisma/schema.prisma || (echo "Prisma schemas out of sync!" && exit 1)
      - name: Check Prisma migration drift
        run: python3 scripts/check_schema_drift.py

  ios-release-config:
    name: iOS Release Config Preflight
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Hexbound
    steps:
      - uses: actions/checkout@v5
      - name: Check iOS runtime/release config
        run: python3 scripts/check_release_config.py --allow-missing-local-values
